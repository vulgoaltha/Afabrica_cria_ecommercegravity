<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciar Categorias - Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white hidden md:flex flex-col">
            <div class="p-6">
                <h1 class="text-2xl font-bold tracking-tighter">ADMIN<span class="text-yellow-500">.CRIA</span></h1>
            </div>
            <nav class="flex-1 px-4 space-y-2">
                <a href="/admin/dashboard.html"
                    class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <span>📊</span> Dashboard
                </a>
                <a href="pedidos.html"
                    class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <span>📦</span> Pedidos
                </a>
                <a href="produtos.html"
                    class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <span>👕</span> Produtos
                </a>
                <a href="categorias.html"
                    class="flex items-center gap-3 px-4 py-3 bg-yellow-500 text-black font-bold rounded-lg shadow-lg shadow-yellow-500/20">
                    <span>🏷️</span> Categorias
                </a>
                <a href="reviews.html"
                    class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <span>⭐</span> Avaliações
                </a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <button id="btnLogout"
                    class="w-full flex items-center gap-2 px-4 py-2 text-red-400 hover:text-red-300 transition-colors">
                    <span>🚪</span> Sair
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10">
                <button class="md:hidden text-gray-600">☰</button>
                <h2 class="text-xl font-semibold text-gray-800">Gerenciar Categorias</h2>
            </header>

            <div class="flex-1 overflow-auto p-6">
                <div class="max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-6">

                    <!-- Create Category Form -->
                    <div class="md:col-span-1">
                        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 sticky top-6">
                            <h3 class="text-lg font-bold text-gray-800 mb-4">Nova Categoria</h3>
                            <form id="categoryForm" class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Nome da
                                        Categoria</label>
                                    <input type="text" id="catTitle" required placeholder="Ex: Bermudas"
                                        class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-black focus:border-black outline-none transition-all">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-gray-700 mb-1">Slug (URL)</label>
                                    <input type="text" id="catSlug" required placeholder="Ex: bermudas"
                                        class="w-full px-4 py-2 border rounded-lg bg-gray-50 text-gray-600 focus:ring-2 focus:ring-black outline-none transition-all">
                                    <p class="text-xs text-gray-400 mt-1">Usado na URL do site. Sem espaços ou acentos.
                                    </p>
                                </div>
                                <button type="submit" id="btnSave"
                                    class="w-full bg-black text-white py-2 rounded-lg hover:bg-gray-800 transition-colors font-medium shadow-lg">
                                    Adicionar Categoria
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Categories List -->
                    <div class="md:col-span-2">
                        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                            <div class="p-4 border-b border-gray-100 bg-gray-50">
                                <h3 class="font-bold text-gray-700">Categorias Existentes</h3>
                            </div>
                            <div id="loading" class="p-8 text-center">
                                <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-gray-900 mx-auto"></div>
                            </div>
                            <ul id="categoriesList" class="divide-y divide-gray-100">
                                <!-- Items injected via JS -->
                            </ul>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../js/admin-categories.js"></script>
</body>

</html>
