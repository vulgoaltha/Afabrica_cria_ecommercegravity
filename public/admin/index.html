<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - ADMIN.CRIA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>

<body class="bg-gray-100">
    <div class="flex h-screen overflow-hidden">

        <!-- Sidebar -->
        <aside class="w-64 bg-gray-900 text-white hidden md:flex flex-col">
            <div class="p-6">
                <h1 class="text-2xl font-bold tracking-tighter">ADMIN<span class="text-yellow-500">.CRIA</span></h1>
            </div>
            <nav class="flex-1 px-4 space-y-2">
                <a href="dashboard.html"
                    class="flex items-center gap-3 px-4 py-3 bg-yellow-500 text-black font-bold rounded-lg shadow-lg shadow-yellow-500/20">
                    <span>📊</span> Dashboard
                </a>
                <a href="pedidos.html"
                    class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <span>📦</span> Pedidos
                </a>
                <a href="produtos.html"
                    class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <span>👕</span> Produtos
                </a>
                <a href="categorias.html"
                    class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <span>🏷️</span> Categorias
                </a>
                <a href="reviews.html"
                    class="flex items-center gap-3 px-4 py-3 text-gray-400 hover:bg-gray-800 hover:text-white rounded-lg transition-colors">
                    <span>⭐</span> Avaliações
                </a>
            </nav>
            <div class="p-4 border-t border-gray-800">
                <button id="btnLogout"
                    class="w-full flex items-center gap-2 px-4 py-2 text-red-400 hover:text-red-300 transition-colors">
                    <span>🚪</span> Sair
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <div class="flex-1 flex flex-col overflow-hidden">
            <!-- Header -->
            <header class="bg-white shadow-sm h-16 flex items-center justify-between px-6 z-10">
                <button class="md:hidden text-gray-600">☰</button>
                <div class="flex items-center gap-4">
                    <h2 class="text-xl font-semibold text-gray-800">Visão Geral</h2>
                </div>
                <div class="flex items-center gap-4">
                    <span id="user-display" class="text-sm text-gray-600">Carregando...</span>
                    <div
                        class="w-8 h-8 rounded-full bg-yellow-500 flex items-center justify-center text-black font-bold">
                        A</div>
                </div>
            </header>

            <!-- Dashboard Content -->
            <main class="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50 p-6">

                <!-- Stats Cards -->
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                    <div
                        class="bg-white rounded-xl p-6 border border-gray-100 shadow-sm transition-transform hover:scale-[1.02]">
                        <p class="text-gray-400 text-xs uppercase font-bold mb-1">Faturamento (Mês)</p>
                        <p class="text-2xl font-black text-gray-900" id="total-revenue">R$ 0,00</p>
                    </div>

                    <div
                        class="bg-white rounded-xl p-6 border border-gray-100 shadow-sm transition-transform hover:scale-[1.02]">
                        <p class="text-gray-400 text-xs uppercase font-bold mb-1">Novos Pedidos</p>
                        <p class="text-2xl font-black text-gray-900" id="total-orders">0</p>
                    </div>

                    <div
                        class="bg-white rounded-xl p-6 border border-gray-100 shadow-sm transition-transform hover:scale-[1.02]">
                        <p class="text-gray-400 text-xs uppercase font-bold mb-1">Aguardando Pagamento</p>
                        <p class="text-2xl font-black text-yellow-600" id="pending-orders">0</p>
                    </div>

                    <div
                        class="bg-white rounded-xl p-6 border border-gray-100 shadow-sm transition-transform hover:scale-[1.02]">
                        <p class="text-gray-400 text-xs uppercase font-bold mb-1">Avaliações Pendentes</p>
                        <p class="text-2xl font-black text-blue-600" id="pending-reviews">0</p>
                    </div>
                </div>

                <!-- Recent Orders Table -->
                <div class="bg-white rounded-xl border border-gray-100 shadow-sm overflow-hidden">
                    <div class="p-6 border-b border-gray-50 flex justify-between items-center bg-gray-50/50">
                        <h3 class="font-bold text-gray-800">Últimos Pedidos</h3>
                        <a href="pedidos.html" class="text-sm text-yellow-600 font-bold hover:underline">Ver todos →</a>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left">
                            <thead class="bg-gray-50 text-gray-500 text-[10px] uppercase font-bold tracking-wider">
                                <tr>
                                    <th class="px-6 py-4">ID</th>
                                    <th class="px-6 py-4">Cliente</th>
                                    <th class="px-6 py-4">Valor</th>
                                    <th class="px-6 py-4">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-gray-100" id="recent-orders-body">
                                <tr>
                                    <td colspan="4" class="px-6 py-8 text-center text-gray-400">Carregando dados...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module">
        import { logout, protegerAdmin } from '../js/auth.js';
        import { supabase } from '../js/supabase.js';

        protegerAdmin(async (user) => {
            document.getElementById('user-display').textContent = user.email;
            loadDashboardData();
        });

        document.getElementById('btnLogout').addEventListener('click', async () => {
            await logout();
            window.location.href = '/admin/login.html';
        });

        async function loadDashboardData() {
            try {
                const { data: orders } = await supabase
                    .from('orders')
                    .select('*')
                    .order('created_at', { ascending: false })
                    .limit(5);

                const tbody = document.getElementById('recent-orders-body');
                tbody.innerHTML = '';

                if (!orders || orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="4" class="p-8 text-center text-gray-400">Nenhum pedido recente.</td></tr>';
                } else {
                    orders.forEach(order => {
                        const total = (order.total_in_cents || 0) / 100;
                        const tr = document.createElement('tr');
                        tr.className = "hover:bg-gray-50 transition-colors";
                        tr.innerHTML = `
                            <td class="px-6 py-4 font-mono text-xs text-gray-400">#${order.id.slice(0, 6)}</td>
                            <td class="px-6 py-4 font-semibold text-gray-700">${order.customer_name || 'Desconhecido'}</td>
                            <td class="px-6 py-4 font-bold text-green-600">R$ ${total.toFixed(2)}</td>
                            <td class="px-6 py-4">
                                <span class="px-2 py-1 text-[10px] font-bold rounded bg-gray-100 text-gray-600 border border-gray-200 uppercase">
                                    ${order.status || 'Pendente'}
                                </span>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                    document.getElementById('total-orders').textContent = orders.length;
                }
            } catch (e) {
                console.error(e);
            }
        }
    </script>
</body>

</html>
